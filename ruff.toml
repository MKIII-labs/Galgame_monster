# ruff 配置：只开「真问题」类规则，不做风格洁癖（本项目无格式化历史，贸然全开会淹没重点）。
# 用法：
#   .venv\Scripts\python.exe -m ruff check app scripts tests
#   .venv\Scripts\python.exe -m ruff check --fix app scripts tests
line-length = 120
target-version = "py310"

[lint]
# E4 导入相关 / E7 语句相关 / E9 语法错误 / F pyflakes（未定义名、未用导入）/ W6 废弃写法
select = ["E4", "E7", "E9", "F", "W6"]
ignore = [
    "E402",   # 允许脚本「先 sys.path.insert 再 import」
    "E731",   # 允许 lambda 赋值（提示词装配里用作默认回调）
    "F401",   # 未用 import 由 scripts/clean_unused_imports.py 专门处理，避免两套工具打架
]
