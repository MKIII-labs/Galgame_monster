<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1513">
<meta name="robots" content="noindex, nofollow">
<title>Galgame Monster · 手机</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span id="dot" class="dot off"></span>
    <span id="title">Galgame Monster</span>
    <span id="net-tip" class="net-tip">未连接</span>
  </div>
  <button id="btn-refresh" class="text-btn" type="button">刷新</button>
</header>

<main id="app">
  <!-- 会话 -->
  <section id="view-sessions" class="view">
    <div class="toolbar">
      <input id="session-search" class="search" type="search" placeholder="搜索会话" autocomplete="off">
      <button id="btn-new" class="btn primary compact" type="button">新建</button>
    </div>
    <div class="chips" id="session-filters">
      <button class="chip active" data-filter="all" type="button">全部</button>
      <button class="chip" data-filter="busy" type="button">进行中</button>
      <button class="chip" data-filter="pending" type="button">待处理</button>
    </div>
    <div id="session-list" class="list"></div>
  </section>

  <!-- 聊天 -->
  <section id="view-chat" class="view hidden">
    <div class="chat-head">
      <button id="btn-back" class="text-btn" type="button">返回</button>
      <div class="chat-title-wrap">
        <div id="chat-title" class="chat-title">会话</div>
        <div id="chat-sub" class="chat-sub"></div>
      </div>
      <button id="btn-stop" class="text-btn danger" type="button">停止</button>
    </div>
    <div id="messages" class="messages"></div>
    <button id="btn-bottom" class="fab hidden" type="button">回到底部</button>
    <div id="cards" class="cards hidden"></div>
    <div class="composer">
      <button id="btn-mic" class="text-btn" type="button">语音</button>
      <textarea id="input" rows="1" placeholder="发消息…"></textarea>
      <button id="btn-send" class="btn primary" type="button">发送</button>
    </div>
  </section>

  <!-- 设备 -->
  <section id="view-device" class="view hidden">
    <h3>连接</h3>
    <div id="conn-info" class="kv"></div>
    <div class="row-actions">
      <button id="btn-reconnect" class="btn" type="button">重新连接</button>
      <button id="btn-unpair" class="btn danger" type="button">解除配对</button>
    </div>
    <h3>本机设备</h3>
    <div id="device-info" class="kv"></div>
    <h3>安全</h3>
    <p class="hint">传输为 HTTPS（本地 CA）+ 应用层端到端加密（ECDH P-256 → HKDF → AES-256-GCM）。
      审批、发消息等高危请求由本机私钥签名，网关被攻破也无法伪造。</p>
    <p class="hint">根证书指纹：<span id="ca-fp" class="mono"></span></p>
  </section>
</main>

<nav class="tabbar">
  <button class="tab active" data-view="sessions" type="button">会话</button>
  <button class="tab" data-view="chat" type="button">聊天</button>
  <button class="tab" data-view="device" type="button">设备</button>
</nav>

<div id="pair-mask" class="mask hidden">
  <div class="dialog">
    <h3 id="pair-title">配对</h3>
    <p id="pair-text" class="hint"></p>
    <div id="pair-sas" class="sas hidden"></div>
    <div class="row-actions">
      <button id="pair-cancel" class="btn" type="button">取消</button>
    </div>
  </div>
</div>

<div id="img-mask" class="mask hidden">
  <img id="img-view" alt="">
  <button id="img-close" class="img-close" type="button">关闭</button>
</div>

<script src="/app.js"></script>
</body>
</html>
