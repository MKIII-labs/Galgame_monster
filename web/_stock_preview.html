<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>模拟股市 · 渲染自检</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/hall.css">
<link rel="stylesheet" href="css/hall-stock.css">
<style>
  /* 自检页自己的外壳，不影响被测的 .stock-* 样式 */
  html, body { margin: 0; padding: 0; background: #0d1117; }
  #hall-body { padding: 0; }
  #preview-root { min-height: 100vh; }
</style>
</head>
<body>
<div id="hall-body" class="hall-body"><div id="preview-root"></div></div>

<script>
/* ---------- 用 fixture 里真实的后端数据替换 api() ---------- */
window.__FIXTURE__ = null;
window.__API_LOG__ = [];

function api(path, body) {
  window.__API_LOG__.push(path);
  const f = window.__FIXTURE__ || {};
  const p = String(path);
  /* 挂起永不 resolve：stockMount 会先请求 /list 渲染设置页，
     一旦它返回就会把对局页覆盖掉。自检只关心对局页，所以这里挡住。 */
  if (p.endsWith('/list')) return new Promise(() => {});
  if (p.endsWith('/state')) return Promise.resolve({ ok: true, game: f.state });
  if (p.endsWith('/bars')) {
    const b = (f.bars || {})[body && body.symbol] || {};
    return Promise.resolve({ ok: true, as_of: b.as_of, bars: b.bars || [], marks: b.marks || [] });
  }
  if (p.endsWith('/risk')) return Promise.resolve({ ok: true, risk: f.risk || {} });
  if (p.endsWith('/report')) return Promise.resolve({ ok: true, report: f.report || {} });
  if (p.endsWith('/analysis')) return Promise.resolve({ ok: true });
  return Promise.resolve({ ok: true });
}
function toast(msg) { console.log('[toast]', msg); }
function toastErr(what, e) { console.log('[toastErr]', what, e); }
function confirm() { return false; }
function hallRegister() {}
function hallAiEnabled() { return false; }
/* 真实实现返回一个开关节点并被 appendChild，桩必须返回 Node，否则 appendChild(undefined) 报错 */
function hallAiSwitch(label, text, onToggle) {
  const wrap = document.createElement('label');
  wrap.className = 'hall-ai-switch';
  const box = document.createElement('input');
  box.type = 'checkbox';
  box.onchange = () => onToggle && onToggle(box.checked);
  wrap.appendChild(box);
  wrap.appendChild(document.createTextNode(text || label || ''));
  return wrap;
}
function isImeComposing() { return false; }
function onHoverDate() {}
</script>
<script src="_stock_fixture.js"></script>
<script src="hall-stock.js"></script>
<script>
/* ---------- 挂载并灌数据 ---------- */
window.__RENDER_ERRORS__ = [];
window.addEventListener('error', (e) => {
  window.__RENDER_ERRORS__.push(String(e.message || e.error || e));
});
window.addEventListener('unhandledrejection', (e) => {
  window.__RENDER_ERRORS__.push('unhandled: ' + String(e.reason));
});

function boot(fixture) {
  window.__FIXTURE__ = fixture;
  const root = document.getElementById('preview-root');
  stockMount(root);
  // stockMount 会先渲染设置页；直接灌 game 走全量渲染
  setTimeout(() => {
    stockState.game = fixture.state;
    stockState.symbol = (fixture.state.symbols[0] || {}).symbol || '';
    // stockApplyFull 只更新已有区块，骨架必须先由 stockRenderGame 建立
    stockRenderGame();
    stockApplyFull(fixture.state);
    // 手动灌 K 线（等价于 stockLoadBars 拿到数据后的状态）
    const sym = stockState.symbol;
    const b = (fixture.bars || {})[sym] || {};
    stockState.chartBars = b.bars || [];
    stockState.chartMarks = b.marks || [];
    stockState.barsCache[sym] = b.bars || [];
    stockState.marksCache[(fixture.state.cursor_date || '') + '|' + sym] = b.marks || [];
    stockDrawChart();

    /* ---------- 自检 1：侧栏三标签页存在且点击后内容真的切换 ---------- */
    const tabs = Array.from(root.querySelectorAll('.stock-tab'));
    const panels = Array.from(root.querySelectorAll('.stock-tabpanel'));
    const tabNames = tabs.map((t) => t.getAttribute('data-tab'));
    const vis = (el) => !!el && !el.classList.contains('hidden') && el.offsetHeight > 0;
    const switched = [];
    tabs.forEach((tab) => {
      tab.click();
      const name = tab.getAttribute('data-tab');
      const mine = root.querySelector('.stock-tabpanel[data-panel="' + name + '"]');
      const others = panels.filter((p) => p !== mine);
      switched.push({
        tab: name,
        mineVisible: vis(mine),
        othersHidden: others.every((p) => !vis(p)),
        aria: tab.getAttribute('aria-selected'),
      });
    });
    tabs[0].click();
    const tabOk = tabs.length === 3 && panels.length === 3
      && switched.every((s) => s.mineVisible && s.othersHidden && s.aria === 'true');

    /* ---------- 自检 2：K 线十字光标与买卖标记都在 DOM 里 ---------- */
    const svg = root.querySelector('.stock-chart');
    const crossG = svg && svg.querySelector('g[display]');
    const markCount = svg ? svg.querySelectorAll('.stock-mark').length : 0;
    const chartOk = !!svg && !!crossG && markCount > 0;

    /* ---------- 自检 3：限价开关与快捷仓位按钮存在 ---------- */
    const limitBox = root.querySelector('#stock-limit');
    const quickBtns = root.querySelectorAll('#stock-quick [data-frac]');
    const orderOk = !!limitBox && quickBtns.length >= 3;

    const results = [
      ['侧栏三标签可切换', tabOk, 'tabs=' + tabs.length + ' panels=' + panels.length + ' ' + JSON.stringify(switched)],
      ['K线十字光标+买卖标记', chartOk, 'svg=' + !!svg + ' crossG=' + !!crossG + ' marks=' + markCount],
      ['限价开关+快捷仓位', orderOk, 'limitInput=' + !!limitBox + ' quick=' + quickBtns.length],
    ];
    const failed = results.filter((r) => !r[1]);
    const box = document.createElement('div');
    box.id = 'selfcheck';
    box.style.cssText = 'font:12px/1.6 monospace;padding:6px 10px;margin:6px 0;border-radius:6px;'
      + (failed.length ? 'background:#4a1010;color:#ffb4b4;' : 'background:#0f2d1a;color:#7ee2a8;');
    box.textContent = results.map((r) => (r[1] ? 'PASS ' : 'FAIL ') + r[0] + ' — ' + r[2]).join('  |  ');
    document.getElementById('preview-root').prepend(box);
    window.__SELFCHECK__ = { tabOk: tabOk, chartOk: chartOk, orderOk: orderOk, results: results };
    if (failed.length) {
      const msg = '自检失败：' + failed.map((r) => r[0] + '（' + r[2] + '）').join('；');
      window.__RENDER_ERRORS__.push(msg);
      // 必须真的抛出：只 push 进自定义数组不会产生运行时错误，render_check 抓不到
      throw new Error(msg);
    }
    window.__READY__ = true;
  }, 60);
}

/* fixture 由 _stock_fixture.js 内联提供（file:// 读不了本地 JSON） */
if (window.__FIXTURE__) boot(window.__FIXTURE__);
else window.__NEED_INLINE__ = true;
</script>
</body>
</html>
