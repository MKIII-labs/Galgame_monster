name: CI

# 触发：推 main / 任意 PR / 手动
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支连推多次时，取消上一次未跑完的，省时间也省额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint · ruff + 语法编译
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 安装 ruff（版本与本地 venv 一致，避免新规则把 CI 打红）
        run: python -m pip install "ruff==0.17.0"
      - name: ruff check（只开 ruff.toml 里的 E4/E7/E9/F/W6）
        run: ruff check app scripts tests
      - name: 全量语法编译（不需要装第三方依赖，能抓 SyntaxError）
        run: python -m compileall -q app scripts main.py server.py

  test:
    name: test · pytest（Windows / py3.13）
    # 只跑 Windows：pywinpty（ConPTY）、uiautomation（桌面）、Edge 扩展等能力是 Windows 专属，
    # 换 Linux 需要先改造这些测试；跨平台绿不在本次承诺范围内。
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"        # 源码与输出含中文，避免 cp1252 解码报错
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pytest>=8"
      - name: 自检（全量 import + 起服务冒烟 + 前端/译页断言，约 10s）
        run: python scripts/dev_check.py
      - name: pytest 全量（约 2200 条）
        run: python -m pytest -q --tb=short
